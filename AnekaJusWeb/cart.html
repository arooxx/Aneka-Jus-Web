<!DOCTYPE html>
<html lang="id">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Keranjang - Aneka Jus</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <link rel="stylesheet" href="assets/css/style.css">
</head>

<body>

    <nav class="navbar">
        <a href="index.html" class="logo">
            <img src="assets/img/logo.png" alt="Logo" onerror="this.style.display='none'">
            Aneka Jus
        </a>
        <ul class="nav-links">
            <li><a href="index.html">Home</a></li>
            <li><a href="menu.html">Menu</a></li>
            <li><a href="contact.html">Kontak</a></li>
        </ul>
        <div class="nav-right">
            <a href="cart.html" class="btn-cart">
                <i class="fa-solid fa-cart-shopping"></i>
                <span class="badge" id="cart-count">0</span>
            </a>
            <a href="login.html" class="btn-admin">
                <i class="fa-solid fa-user-lock"></i> Admin
            </a>
        </div>
    </nav>

    <section class="cart-section-wrapper">
        <div class="cart-box">
            <h2 class="section-title">Keranjang Belanja</h2>

            <div class="cart-container">
                <table class="cart-table">
                    <thead>
                        <tr>
                            <th>Produk</th>
                            <th>Harga</th>
                            <th>Jumlah</th>
                            <th>Total</th>
                            <th>Aksi</th>
                        </tr>
                    </thead>
                    <tbody id="cart-items">
                    </tbody>
                </table>

                <div id="empty-cart-msg" style="display: none;">
                    <p>Keranjang Anda masih kosong.</p>
                    <a href="menu.html" class="btn-cta">Belanja Sekarang</a>
                </div>
            </div>

            <div class="cart-summary" id="cart-summary">
                <div class="checkout-form">
                    <label for="customer-name">Nama Pemesan:</label>
                    <input type="text" id="customer-name" placeholder="Masukkan Nama Anda..." autocomplete="off">

                    <div class="payment-note">
                        <h4><i class="fa-solid fa-credit-card"></i> Info Pembayaran</h4>
                        <div class="pay-item">
                            <span class="pay-label">DANA:</span>
                            <span class="pay-number">0812-3456-7890</span>
                        </div>
                        <div class="pay-item">
                            <span class="pay-label">BRI:</span>
                            <span class="pay-number">1234-5678-9012-345</span>
                        </div>
                        <p class="pay-alert">*Mohon transfer sesuai total tagihan</p>
                    </div>
                </div>

                <div class="checkout-action">
                    <h3>Total: <span id="cart-total">Rp 0</span></h3>
                    <button class="btn-checkout" onclick="checkout()">
                        <i class="fa-solid fa-check"></i> Proses Pesanan
                    </button>
                </div>

            </div>
        </div>
    </section>

    <script src="assets/js/script.js"></script>
</body>

</html>
