<!DOCTYPE html>
<html lang="id">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login Admin - Aneka Jus</title>
    <link rel="stylesheet" href="assets/css/style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
</head>

<body class="auth-body">

    <header class="auth-header">
        <div class="logo">
            <i class="fa-solid fa-glass-water" style="color:#27ae60;"></i>
            <span>Portal Admin</span>
        </div>
    </header>

    <div class="auth-wrapper">
        <div class="auth-card">

            <div class="auth-form-section">
                <h2>Login</h2>
                <form onsubmit="handleLogin(event)">
                    <div class="input-group">
                        <input type="text" id="login-username" placeholder="Username" required>
                    </div>
                    <div class="input-group">
                        <input type="password" id="login-password" placeholder="Password" required>
                    </div>
                    <button type="submit" class="btn-auth">Masuk</button>
                </form>
                <p class="auth-footer-text">
                    Belum punya akun? <a href="register.html">Daftar di sini</a>
                </p>
            </div>

            <div class="auth-image-section">
                <div class="overlay-text">
                    <h3>Halo, Admin!</h3>
                    <p>Silakan masuk untuk mengelola pesanan.</p>
                </div>
            </div>

        </div>
    </div>

    <footer class="auth-footer">
        <p>Copyright © AnekaJus 2025</p>
    </footer>

    <script src="assets/js/script.js"></script>
</body>

</html>
