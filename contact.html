<!DOCTYPE html>
<html lang="id">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kontak - Aneka Jus</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <link rel="stylesheet" href="assets/css/style.css">
</head>

<body>

    <nav class="navbar">
        <a href="index.html" class="logo">
            <img src="assets/img/logo.png" alt="Logo" onerror="this.style.display='none'">
            Aneka Jus
        </a>

        <ul class="nav-links">
            <li><a href="index.html">Home</a></li>
            <li><a href="menu.html">Menu</a></li>
            <li><a href="contact.html" class="active">Kontak</a></li>
        </ul>

        <div class="nav-right">
            <a href="cart.html" class="btn-cart">
                <i class="fa-solid fa-cart-shopping"></i>
                <span class="badge" id="cart-count">0</span>
            </a>
            <a href="login.html" class="btn-admin">
                <i class="fa-solid fa-user-lock"></i> Admin
            </a>
        </div>
    </nav>

    <section class="contact-section-wrapper">
        <div class="contact-box">

            <h2 class="section-title">Hubungi Kami</h2>
            <p class="section-subtitle">Punya pertanyaan atau ingin memesan dalam jumlah banyak?</p>

            <div class="contact-grid">

                <div class="contact-info">
                    <div class="info-item">
                        <i class="fa-solid fa-location-dot"></i>
                        <div>
                            <h4>Alamat Toko</h4>
                            <p>Jl. Kramatmulya-Cikaso, Kab. Kuningan</p>
                        </div>
                    </div>

                    <div class="info-item">
                        <i class="fa-brands fa-whatsapp"></i>
                        <div>
                            <h4>WhatsApp</h4>
                            <p>+62 812-3456-7890</p>
                        </div>
                    </div>

                    <div class="info-item">
                        <i class="fa-regular fa-clock"></i>
                        <div>
                            <h4>Jam Buka</h4>
                            <p>Senin - Minggu: 09:00 - 21:00</p>
                        </div>
                    </div>

                    <div class="map-container">
                        <iframe
                            src="https://www.google.com/maps/embed?pb=!1m14!1m8!1m3!1d308.4601891029623!2d108.48885912598926!3d-6.930286536420483!3m2!1i1024!2i768!4f13.1!3m3!1m2!1s0x2e6f1705e6bcfc9d%3A0xa1f5644093d63521!2sNYOKLAT%20ASM!5e1!3m2!1sid!2sid!4v1768441452100!5m2!1sid!2sid"
                            width="100%" height="200" style="border:0;" allowfullscreen="" loading="lazy">
                        </iframe>
                    </div>
                </div>

                <div class="contact-form">
                    <form>
                        <div class="form-group">
                            <label>Nama Lengkap</label>
                            <input type="text" placeholder="Masukkan nama Anda" required>
                        </div>
                        <div class="form-group">
                            <label>Email / No HP</label>
                            <input type="text" placeholder="Contoh: 0812xxx" required>
                        </div>
                        <div class="form-group">
                            <label>Pesan</label>
                            <textarea rows="4" placeholder="Tulis pesan Anda di sini..."></textarea>
                        </div>
                        <button type="submit" class="btn-submit">Kirim Pesan</button>
                    </form>
                </div>

            </div>
        </div>
    </section>

    <script src="assets/js/script.js"></script>
</body>

</html>
